<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="">
	<!-- Abstract fluid composition in the Story & Measure palette:
	     cream ground, forest-green ink, orange / lavender / chartreuse washes -->
	<defs>
		<linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#f6e1fd"/>
			<stop offset="1" stop-color="#eff483"/>
		</linearGradient>
	</defs>

	<!-- soft lavender-to-chartreuse field -->
	<path fill="url(#wash)" d="M400 78c118 0 236 46 284 148 46 98 12 224-52 306-66 84-142 148-244 146-104-2-208-58-260-158C76 420 92 296 164 210 234 126 300 78 400 78Z"/>

	<!-- forest green fluid form -->
	<path fill="#194027" d="M424 168c86 6 168 52 202 130 34 80 8 176-44 240-54 66-120 108-200 102-82-6-158-58-192-136-32-76-16-166 36-230 54-66 114-112 198-106Z"/>

	<!-- orange blob overlapping -->
	<path fill="#ed6b2d" d="M290 372c50-58 140-70 206-34 64 34 96 112 76 180-20 70-86 118-158 116-74-2-140-50-160-120-18-60 0-98 36-142Z" opacity="0.94"/>

	<!-- cream ripple lines echoing the "measure" motif -->
	<g fill="none" stroke="#fff6ed" stroke-width="7" stroke-linecap="round" opacity="0.85">
		<path d="M266 470c44 30 96 44 148 40"/>
		<path d="M282 522c40 26 86 38 132 34"/>
		<path d="M310 572c32 20 68 30 104 26"/>
	</g>

	<!-- rising chart line: the story, measured -->
	<g fill="none" stroke="#fff6ed" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
		<path d="M330 330l52-44 44 24 66-62"/>
	</g>
	<circle cx="492" cy="248" r="14" fill="#eff483"/>

	<!-- lavender accent dot + chartreuse crescent -->
	<circle cx="620" cy="560" r="46" fill="#f6e1fd"/>
	<path fill="#eff483" d="M186 236a72 72 0 0 1 100-66 88 88 0 0 0-58 82 88 88 0 0 0 6 32 72 72 0 0 1-48-48Z"/>
</svg>
